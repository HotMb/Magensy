name: Magensy verification
on:
  push:
    branches: [main, hotmb/guardian-review-7c42af]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm exec -- tsc --noEmit
      - run: node --test tests/guardian-smoke.test.mjs